<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Blueant Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after {
  margin: 0; padding: 0; box-sizing: border-box;
}

:root {
  --bg:      #d5dfec;
  --surface: #ffffff;
  --card:    #ffffff;
  --border:  rgba(35, 55, 90, 0.11);
  --text:    #111827;
  --text-dim:   #52627a;
  --text-faint: #8390a5;
  --gold:  #c87912;
  --green: #078f71;
  --amber: #b76b00;
  --red:   #c72f52;
  --blue:  #2458d3;
  --team-harsh: #2563eb;
  --team-harsh-2: #06b6d4;
  --team-harsh-soft: #dbeafe;
  --team-alok: #059669;
  --team-alok-2: #84cc16;
  --team-alok-soft: #d1fae5;
  --team-ashutosh: #7c3aed;
  --team-ashutosh-2: #ec4899;
  --team-ashutosh-soft: #ede9fe;
  --shadow-soft: 0 14px 32px rgba(31, 45, 71, 0.12);
  --shadow-row: 0 16px 34px rgba(31, 45, 71, 0.18);
}

body {
  background:
    radial-gradient(circle at 7% 8%, rgba(37, 99, 235, 0.22), transparent 28%),
    radial-gradient(circle at 42% 2%, rgba(236, 72, 153, 0.13), transparent 24%),
    radial-gradient(circle at 88% 5%, rgba(5, 150, 105, 0.19), transparent 28%),
    radial-gradient(circle at 72% 86%, rgba(245, 158, 11, 0.11), transparent 26%),
    linear-gradient(180deg, #dde7f3 0%, var(--bg) 44%, #c8d5e4 100%);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  min-height: 100vh;
  overflow-x: auto;
}

.topbar {
  display: flex;
  flex-direction: column;
  background:
    linear-gradient(90deg, rgba(37,99,235,0.14), rgba(124,58,237,0.10) 36%, rgba(5,150,105,0.12) 72%, rgba(245,158,11,0.12)),
    linear-gradient(180deg, rgba(255,255,255,0.97), rgba(248,251,255,0.93));
  border-bottom: 1px solid var(--border);
  box-shadow: 0 12px 36px rgba(27, 43, 74, 0.08);
}

.topbar-main {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 18px 32px;
}

.topbar-left {
  display: flex;
  align-items: center;
  gap: 42px;
}

.logo {
  height: 72px;
  width: auto;
  object-fit: contain;
  display: block;
}

.topbar-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 44px;
  letter-spacing: 2px;
  color: #1d4ed8;
  text-shadow: 0 8px 20px rgba(36, 88, 211, 0.18);
}

.topbar-sub {
  color: var(--text-dim);
  font-size: 24px;
  letter-spacing: 3px;
}

.topbar-right {
  display: flex;
  align-items: center;
  gap: 26px;
}

/* ── LIVE BADGE ─────────────────────────────── */
.live-badge {
  display: flex;
  align-items: center;
  gap: 8px;
  background: linear-gradient(180deg, #ecfdf5, #dff8ec);
  border: 1px solid rgba(7,143,113,0.24);
  padding: 8px 16px;
  border-radius: 30px;
  color: var(--green);
  font-size: 20px;
  font-weight: 700;
  letter-spacing: 2px;
  box-shadow: 0 8px 18px rgba(7,143,113,0.10);
}

.live-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--green);
  animation: pulse 1.4s infinite;
}

@keyframes pulse {
  0%,100% { opacity:1; transform:scale(1); }
  50%      { opacity:0.3; transform:scale(0.6); }
}

/* ── REFRESH BUTTON ─────────────────────────── */
.refresh-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  background: linear-gradient(180deg, #eef4ff, #e5edff);
  border: 1px solid rgba(36,88,211,0.22);
  padding: 8px 16px;
  border-radius: 30px;
  color: var(--blue);
  font-size: 20px;
  font-weight: 700;
  letter-spacing: 1px;
  cursor: pointer;
  transition: all 0.3s ease;
  box-shadow: 0 8px 18px rgba(36,88,211,0.09);
}
.refresh-btn:hover {
  background: linear-gradient(180deg, #e8f0ff, #dce8ff);
  border-color: rgba(36,88,211,0.36);
  box-shadow: 0 12px 24px rgba(36,88,211,0.14);
}
.refresh-icon { display:inline-block; }
.refresh-btn:active .refresh-icon { animation: spin 0.6s ease; }
@keyframes spin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }

/* ── UPDATE TIME ────────────────────────────── */
.update-time { color:var(--text-dim); font-size:20px; text-align:right; }
.countdown-line { color:var(--gold); margin-top:4px; font-size:18px; font-family:'DM Mono',monospace; }

.filter-strip {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 11px 32px 13px;
  border-top: 1px solid rgba(35,55,90,0.08);
  background: linear-gradient(90deg, rgba(219,234,254,0.76), rgba(237,233,254,0.64), rgba(209,250,229,0.70), rgba(255,247,237,0.78));
  flex-wrap: wrap;
}

.filter-label {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 17px;
  letter-spacing: 3px;
  color: var(--text-faint);
  flex-shrink: 0;
}

.filter-divider {
  width: 1px; height: 28px;
  background: rgba(35,55,90,0.12);
  flex-shrink: 0;
}

.filter-group {
  display: flex;
  align-items: center;
  gap: 7px;
  flex-wrap: wrap;
}

.fbtn {
    background: #ffffff;
    border: 1px solid rgba(36,88,211,0.17);
    color: var(--blue);
    padding: 8px 16px;
    border-radius: 24px;
    font-family: 'DM Sans', sans-serif;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.4px;
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s, color 0.2s, box-shadow 0.2s;
    outline: none;
    white-space: nowrap;
    box-shadow: 0 6px 16px rgba(31,45,71,0.06);
}
.fbtn:hover {
  background: #f2f6ff;
  border-color: rgba(36,88,211,0.30);
  color: #163ea3;
  box-shadow: 0 10px 22px rgba(36,88,211,0.10);
}
.fbtn.active {
  background: linear-gradient(180deg, #fff6e7, #ffedd3);
  border-color: rgba(200,121,18,0.34);
  color: var(--gold);
  box-shadow: 0 10px 22px rgba(200,121,18,0.13);
}
.fbtn.active:hover {
  background: linear-gradient(180deg, #fff2dc, #ffe5bd);
}

.custom-panel {
  display: none;
  align-items: center;
  gap: 10px;
  padding: 7px 16px;
  background: rgba(255,255,255,0.88);
  border: 1px solid rgba(35,55,90,0.10);
  border-radius: 12px;
  flex-wrap: wrap;
  box-shadow: var(--shadow-soft);
}
.custom-panel.open { display: flex; }

.date-input {
    background: #ffffff;
    border: 1px solid rgba(35,55,90,0.18);
    color: var(--text);
    padding: 5px 11px;
    border-radius: 7px;
    font-size: 14px;
    font-family: 'DM Mono', monospace;
    cursor: pointer;
    outline: none;
    color-scheme: light;
    transition: border-color 0.2s;
}
.date-input:focus { border-color: rgba(36,88,211,0.42); box-shadow: 0 0 0 3px rgba(36,88,211,0.10); }

.range-arrow { color: var(--blue); font-size: 14px; }

.apply-btn {
  background: linear-gradient(135deg, #2563eb, #7c3aed);
  color: #ffffff;
  border: none;
  padding: 6px 18px;
  border-radius: 7px;
  font-weight: 700;
  font-size: 14px;
  cursor: pointer;
  letter-spacing: 0.4px;
  transition: opacity 0.2s, transform 0.1s;
}
.apply-btn:hover { opacity: 0.88; }
.apply-btn:active { transform: scale(0.97); }

.close-panel-btn {
  background: #fff5f7;
  border: 1px solid rgba(199,47,82,0.28);
  color: var(--red);
  width: 26px; height: 26px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 15px;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s;
}
.close-panel-btn:hover { border-color: var(--red); color: var(--red); }

.active-range-lbl {
  display: none;
  margin-left: auto;
  font-family: 'DM Mono', monospace;
  font-size: 13px;
  color: var(--gold);
  background: #fff7e8;
  border: 1px solid rgba(200,121,18,0.20);
  border-radius: 20px;
  padding: 4px 14px;
  letter-spacing: 1px;
  white-space: nowrap;
  flex-shrink: 0;
}

.loading-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(244,247,251,0.86);
  backdrop-filter: blur(6px);
  z-index: 9999;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 22px;
}
.loading-overlay.active { display: flex; }

.loading-ring {
  width: 72px; height: 72px;
  border: 3px solid rgba(36,88,211,0.12);
  border-top-color: var(--blue);
  border-radius: 50%;
  animation: ringpin 0.75s linear infinite;
}
@keyframes ringpin { to { transform: rotate(360deg); } }

.loading-headline {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 28px;
  letter-spacing: 5px;
  color: var(--blue);
}
.loading-detail {
  font-size: 14px;
  color: var(--text-dim);
  letter-spacing: 1px;
  font-family: 'DM Mono', monospace;
}

.loading-progress-track {
  width: 260px; height: 3px;
  background: rgba(35,55,90,0.10);
  border-radius: 3px;
  overflow: hidden;
}
.loading-progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--blue), var(--team-ashutosh));
  border-radius: 3px;
  width: 0%;
  transition: width 0.4s ease;
}

.toast {
  position: fixed;
  bottom: 36px; right: 36px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px 22px;
  font-size: 15px;
  color: var(--text-dim);
  box-shadow: var(--shadow-soft);
  z-index: 10000;
  opacity: 0;
  transform: translateY(10px);
  transition: opacity 0.3s ease, transform 0.3s ease;
  pointer-events: none;
  max-width: 380px;
  font-family: 'DM Mono', monospace;
}
.toast.show          { opacity: 1; transform: translateY(0); }
.toast.toast-warn    { border-color: rgba(255,176,32,0.35); color: var(--amber); }
.toast.toast-success { border-color: rgba(25,226,140,0.35); color: var(--green); }
.toast.toast-error   { border-color: rgba(255,77,95,0.35);  color: var(--red);   }

.board-section {
  padding: 18px 24px 30px;
  background: linear-gradient(180deg, rgba(198,211,228,0.84), rgba(183,199,219,0.78));
}

table {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0 6px;
  min-width: 1800px;
}

thead th {
  text-align: left;
  padding: 5px 16px;
  color: #1e3a8a;
  font-size: 25px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  text-shadow: 0 1px 0 rgba(255,255,255,0.7);
}
thead th:nth-child(3n) { color: #047857; }
thead th:nth-child(3n + 1) { color: #6d28d9; }
thead th:nth-child(3n + 2) { color: #1d4ed8; }

tbody tr {
  background: var(--card);
  box-shadow: var(--shadow-row);
  outline: 1px solid rgba(35,55,90,0.05);
  transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
}

tbody tr:hover {
  transform: translateY(-1px);
  box-shadow: 0 20px 38px rgba(31, 45, 71, 0.18);
  filter: saturate(1.03);
}

tbody tr.row-harsh {
  background:
    linear-gradient(90deg, rgba(37,99,235,0.38), rgba(6,182,212,0.27) 28%, rgba(255,255,255,0.86) 50%, rgba(147,197,253,0.30) 75%, rgba(6,182,212,0.25) 100%),
    #ffffff;
}
tbody tr.row-alok {
  background:
    linear-gradient(90deg, rgba(5,150,105,0.38), rgba(132,204,22,0.30) 28%, rgba(255,255,255,0.86) 50%, rgba(167,243,208,0.34) 75%, rgba(132,204,22,0.26) 100%),
    #ffffff;
}
tbody tr.row-ashutosh {
  background:
    linear-gradient(90deg, rgba(124,58,237,0.38), rgba(236,72,153,0.27) 28%, rgba(255,255,255,0.86) 50%, rgba(196,181,253,0.34) 75%, rgba(236,72,153,0.25) 100%),
    #ffffff;
}

/* Left accent stripe — 3px inset box-shadow, team colour, very low alpha */
tbody tr.row-harsh    td:first-child { box-shadow: inset 6px 0 0 var(--team-harsh), inset 12px 0 0 rgba(6,182,212,0.35);  }
tbody tr.row-alok     td:first-child { box-shadow: inset 6px 0 0 var(--team-alok), inset 12px 0 0 rgba(132,204,22,0.35);  }
tbody tr.row-ashutosh td:first-child { box-shadow: inset 6px 0 0 var(--team-ashutosh), inset 12px 0 0 rgba(236,72,153,0.30);  }

tbody td {
  padding: 12px 16px;
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  background: transparent;
}
tbody td:first-child {
  border-left: 1px solid var(--border);
  border-radius: 12px 0 0 12px;
}
tbody td:last-child {
  border-right: 1px solid var(--border);
  border-radius: 0 12px 12px 0;
}

/* ── RANK ───────────────────────────────────── */
.rank-circle {
  width: 50px; height: 50px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-family: 'DM Mono', monospace;
  font-weight: 700; font-size: 20px;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.75), 0 8px 18px rgba(31,45,71,0.08);
}
.r1 { background:linear-gradient(180deg, #fff7dc, #ffe8ad); color:#9a5b00;  border:1px solid rgba(200,121,18,0.42);  }
.r2 { background:linear-gradient(180deg, #e0f2fe, #dbeafe); color:var(--blue);  border:1px solid rgba(36,88,211,0.34);  }
.r3 { background:linear-gradient(180deg, #dcfce7, #ccfbf1); color:var(--green); border:1px solid rgba(7,143,113,0.34); }
.rn { background:#f6f8fb; color:#64748b; border:1px solid var(--border); }

/* ── MEMBER NAME ────────────────────────────── */
.member-name { font-size: 50px; font-weight: bolder; color: #182235; }
tbody tr.row-harsh .member-name { color: #1d4ed8; }
tbody tr.row-alok .member-name { color: #047857; }
tbody tr.row-ashutosh .member-name { color: #6d28d9; }
tbody tr.row-harsh .big { color: #1e3a8a; }
tbody tr.row-alok .big { color: #065f46; }
tbody tr.row-ashutosh .big { color: #581c87; }

.metric {
  min-width: 230px;
}

.metric-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 6px;
  flex-wrap: nowrap;
  overflow: visible;
}

.m-act {
  font-size: 38px;
  font-weight: bolder;
  white-space: nowrap;
  flex-shrink: 0;
}

.m-tgt {
  color: #718096;
  font-size: 37px;
  font-weight: bold;
  white-space: nowrap;
  flex-shrink: 0;
}

.good  { color: var(--green); }
.ok    { color: var(--amber); }
.bad   { color: var(--red);   }
.zero  { color: var(--red);   }

.bar-track {
  height: 5px;
  background: rgba(35,55,90,0.08);
  border-radius: 20px;
  overflow: hidden;
  box-shadow: inset 0 1px 2px rgba(31,45,71,0.08);
}
.bar-fill { height: 100%; border-radius: 20px; transition: width 0.6s ease; }
.bar-fill.good { background: linear-gradient(90deg, #10b981, var(--green)); }
.bar-fill.ok   { background: linear-gradient(90deg, #f59e0b, var(--amber)); }
.bar-fill.bad  { background: linear-gradient(90deg, #fb7185, var(--red));   }
tbody tr.row-harsh .bar-fill.good { background: linear-gradient(90deg, #38bdf8, var(--team-harsh)); }
tbody tr.row-alok .bar-fill.good { background: linear-gradient(90deg, #a3e635, var(--team-alok)); }
tbody tr.row-ashutosh .bar-fill.good { background: linear-gradient(90deg, #f472b6, var(--team-ashutosh)); }
tbody tr.row-harsh .bar-track { background: rgba(37,99,235,0.18); }
tbody tr.row-alok .bar-track { background: rgba(5,150,105,0.18); }
tbody tr.row-ashutosh .bar-track { background: rgba(124,58,237,0.18); }

/* ── POINTS BADGE ───────────────────────────── */
.pts-badge {
  display: inline-flex;
  justify-content: center;
  align-items: center;
  min-width: 70px;
  padding: 8px 12px;
  border-radius: 8px;
  font-family: 'DM Mono', monospace;
  font-size: 22px;
  white-space: nowrap;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.72), 0 9px 18px rgba(31,45,71,0.08);
}
.pts-top { background:linear-gradient(180deg, #fff7dc, #ffe7a3); border:1px solid rgba(200,121,18,0.32); color:#9a5b00;  font-size:50px; font-weight:bold; }
.pts-mid { background:linear-gradient(180deg, #eef4ff, #dbe8ff); border:1px solid rgba(36,88,211,0.24);  color:var(--blue);  font-size:50px; font-weight:bold; }
.pts-low { background:linear-gradient(180deg, #fff1f3, #ffe2e8);  border:1px solid rgba(199,47,82,0.22);   color:var(--red);   font-size:50px; font-weight:bold; }
tbody tr.row-harsh .pts-mid { background: linear-gradient(135deg, #eff6ff, #cffafe); color: #2563eb; }
tbody tr.row-alok .pts-mid { background: linear-gradient(135deg, #ecfdf5, #f7fee7); color: #059669; }
tbody tr.row-ashutosh .pts-mid { background: linear-gradient(135deg, #f5f3ff, #fdf2f8); color: #7c3aed; }
tbody tr.row-harsh .pts-low { background: linear-gradient(135deg, #fff1f2, #dbeafe); color: #be123c; }
tbody tr.row-alok .pts-low { background: linear-gradient(135deg, #fff7ed, #d1fae5); color: #b45309; }
tbody tr.row-ashutosh .pts-low { background: linear-gradient(135deg, #fff1f2, #ede9fe); color: #be123c; }
tbody tr.row-harsh .pts-top { background: linear-gradient(135deg, #dbeafe, #bae6fd); color: #1d4ed8; border-color: rgba(37,99,235,0.34); }
tbody tr.row-alok .pts-top { background: linear-gradient(135deg, #d1fae5, #ecfccb); color: #047857; border-color: rgba(5,150,105,0.34); }
tbody tr.row-ashutosh .pts-top { background: linear-gradient(135deg, #ede9fe, #fce7f3); color: #6d28d9; border-color: rgba(124,58,237,0.34); }
tbody tr.row-harsh .pts-badge { border-color: rgba(37,99,235,0.34); }
tbody tr.row-alok .pts-badge { border-color: rgba(5,150,105,0.34); }
tbody tr.row-ashutosh .pts-badge { border-color: rgba(124,58,237,0.34); }

/* ── TOTAL ROW ──────────────────────────────── */
.total-row td {
  background: linear-gradient(90deg, #fff7ed, #eef2ff 34%, #ecfdf5 68%, #fdf2f8) !important;
  border-top-color: rgba(200,121,18,0.22);
  border-bottom-color: rgba(200,121,18,0.22);
}

.total-label {
  font-family: 'Bebas Neue', sans-serif;
  color: var(--gold);
  font-size: 55px;
  letter-spacing: 5px;
}

.center { text-align: center; }
.big    { font-size: 50px; font-weight: 700; white-space: nowrap; }

</style>
</head>
<body>

<div class="loading-overlay" id="loadingOverlay">
  <div class="loading-ring"></div>
  <div class="loading-headline" id="loadingHeadline">UPDATING DATE RANGE</div>
  <div class="loading-detail"   id="loadingDetail">Syncing with Google Sheets…</div>
  <div class="loading-progress-track">
    <div class="loading-progress-bar" id="loadingBar"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="topbar">

  <div class="topbar-main">
    <div class="topbar-left">
      <img src="blueAnt.png" class="logo" alt="BlueAnt"/>
      <div>
        <div class="topbar-title">DASHBOARD</div>
        <div class="topbar-sub">MUTUAL FUND TEAM</div>
      </div>
    </div>

    <div class="topbar-right">
      <div class="live-badge">
        <div class="live-dot"></div>
        LIVE
      </div>

      <button class="refresh-btn" onclick="location.reload(true);" title="Force Refresh">
        <span class="refresh-icon">↻</span> REFRESH
      </button>

      <div class="filter-group">
        <button class="fbtn" data-range="custom" onclick="toggleCustomPanel()">Custom Range &#9662;</button>
      </div>

      <div>
        <div class="update-time" id="lastUpdated">Connecting...</div>
        <div class="countdown-line">↻ Next update in <span id="cdNum">10</span>s</div>
      </div>
    </div>
  </div>

  <!-- Filter Strip -->
  <div class="filter-strip">
    <span class="filter-label">DATE RANGE</span>
    <div class="filter-divider"></div>

    <div class="custom-panel" id="customPanel">
      <input type="date" class="date-input" id="fromDate" />
      <span class="range-arrow">&#8594;</span>
      <input type="date" class="date-input" id="toDate" />
      <button class="apply-btn"       onclick="applyCustom()">Apply</button>
      <button class="close-panel-btn" onclick="closeCustomPanel()">&#10005;</button>
    </div>

    <div class="active-range-lbl" id="activeRangeLbl"></div>
  </div>
</div>

<div class="board-section">
  <table>
    <thead>
      <tr>
        <th style="width:90px;">Rank</th>
        <th style="width:260px;">Name</th>
        <th class="center">Yest. I&amp;M</th>
        <th class="center">Yest. Cl.</th>
        <th class="center">Today I&amp;M</th>
        <th class="center">Today Cl.</th>
        <th style="min-width:270px;">Leads</th>
        <th style="min-width:270px;">Intro</th>
        <th style="min-width:270px;">Meetings</th>
        <th class="center">Tgt-Rpt / Doc</th>
        <th class="center">Points</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>
</div>

<script>

const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxZyLPhCRB7pQ5ivX-9FltXfKNhw-CXGqHDAkW3dyzC4EXQ4haFfxEkoD7bniygkugPRA/exec';

const SHEET_ID = '1XX5Io8gpJPmcALPS217MB1j33FMpGMdoFAg80I-cbmA';
const GID      = '806469274';
const CSV_URL  = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${GID}`;
const REFRESH  = 10;

const TEAMS = [
  {
    key:     'harsh',
    rowClass:'row-harsh',
    members: ['Rajat', 'Atul', 'Ameet', 'Rakesh']
  },
  {
    key:     'alok',
    rowClass:'row-alok',
    members: ['Abhijeet', 'Amit', 'Harsh.P', 'Tejprakash']
  },
  {
    key:     'ashutosh',
    rowClass:'row-ashutosh',
    members: ['Saket', 'Umakant', 'Mukul']
  }
];

let cdVal        = REFRESH;
let cdTimer      = null;
let activeFilter = null;
let toastTimer   = null;

function todayMidnight() {
  const d = new Date();
  d.setHours(0, 0, 0, 0);
  return d;
}

function isoDate(d) {
  const y  = d.getFullYear();
  const mo = String(d.getMonth() + 1).padStart(2, '0');
  const da = String(d.getDate()).padStart(2, '0');
  return `${y}-${mo}-${da}`;
}

function displayDate(iso) {
  return new Date(iso + 'T00:00:00').toLocaleDateString('en-IN', {
    day: '2-digit', month: 'short', year: 'numeric'
  });
}

function presetRange(preset) {
  const today = todayMidnight();
  switch (preset) {
    case 'today':
      return { from: isoDate(today), to: isoDate(today) };
    case 'yesterday': {
      const y = new Date(today); y.setDate(today.getDate() - 1);
      return { from: isoDate(y), to: isoDate(y) };
    }
    case '7d': {
      const f = new Date(today); f.setDate(today.getDate() - 6);
      return { from: isoDate(f), to: isoDate(today) };
    }
    case '30d': {
      const f = new Date(today); f.setDate(today.getDate() - 29);
      return { from: isoDate(f), to: isoDate(today) };
    }
    default:
      return null;
  }
}

function showToast(msg, type = '') {
  const el  = document.getElementById('toast');
  el.textContent = msg;
  el.className   = `toast show ${type}`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = 'toast'; }, 3500);
}

function showLoading(headline, detail, progress = 0) {
  document.getElementById('loadingHeadline').textContent = headline;
  document.getElementById('loadingDetail').textContent   = detail;
  document.getElementById('loadingBar').style.width      = progress + '%';
  document.getElementById('loadingOverlay').classList.add('active');
}

function setLoadingProgress(pct, detail) {
  document.getElementById('loadingBar').style.width    = pct + '%';
  document.getElementById('loadingDetail').textContent = detail;
}

function hideLoading() {
  document.getElementById('loadingOverlay').classList.remove('active');
  document.getElementById('loadingBar').style.width = '0%';
}

function setActiveBtn(range) {
  document.querySelectorAll('.fbtn').forEach(btn =>
    btn.classList.toggle('active', btn.dataset.range === range)
  );
  activeFilter = range;
}

function showActiveLabel(from, to) {
  const el = document.getElementById('activeRangeLbl');
  el.textContent = from === to
    ? displayDate(from)
    : `${displayDate(from)}  →  ${displayDate(to)}`;
  el.style.display = '';
}

function toggleCustomPanel() {
  const panel  = document.getElementById('customPanel');
  const isOpen = panel.classList.contains('open');
  if (isOpen) {
    closeCustomPanel();
  } else {
    const today = isoDate(todayMidnight());
    document.getElementById('fromDate').value = today;
    document.getElementById('toDate').value   = today;
    panel.classList.add('open');
    setActiveBtn('custom');
  }
}

function closeCustomPanel() {
  document.getElementById('customPanel').classList.remove('open');
  if (activeFilter === 'custom') {
    document.querySelector('.fbtn[data-range="custom"]').classList.remove('active');
    activeFilter = null;
  }
}

async function writeSheetDates(from, to) {
  if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL === 'https://script.google.com/macros/s/AKfycbxZyLPhCRB7pQ5ivX-9FltXfKNhw-CXGqHDAkW3dyzC4EXQ4haFfxEkoD7bniygkugPRA/exec') {
    showToast('⚠ Apps Script not configured — sheet dates unchanged.', 'toast-warn');
    return false;
  }
  const url = `${APPS_SCRIPT_URL}?from=${encodeURIComponent(from)}&to=${encodeURIComponent(to)}`;
  try {
    await fetch(url, { method: 'GET', mode: 'no-cors' });
  } catch (e) { /* Opaque no-cors — request was sent */ }
  return true;
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

async function applyPreset(preset) {
  const range = presetRange(preset);
  if (!range) return;

  setActiveBtn(preset);
  closeCustomPanel();
  clearInterval(cdTimer);

  showLoading('UPDATING DATE RANGE', 'Writing to Google Sheets…', 10);
  await writeSheetDates(range.from, range.to);

  setLoadingProgress(35, 'Waiting for formulas to recalculate…');
  await sleep(1500);
  setLoadingProgress(65, 'Recalculating…');
  await sleep(1500);
  setLoadingProgress(85, 'Fetching updated data…');

  await load(false);
  setLoadingProgress(100, 'Done!');
  await sleep(300);
  hideLoading();

  showActiveLabel(range.from, range.to);
  showToast(`✓ Range applied: ${range.from === range.to ? displayDate(range.from) : `${displayDate(range.from)} → ${displayDate(range.to)}`}`, 'toast-success');
  startCountdown();
}

async function applyCustom() {
  const from = document.getElementById('fromDate').value;
  const to   = document.getElementById('toDate').value;

  if (!from || !to) {
    showToast('Please select both From and To dates.', 'toast-warn');
    return;
  }
  if (from > to) {
    showToast('From date cannot be later than To date.', 'toast-error');
    return;
  }

  closeCustomPanel();
  setActiveBtn('custom');
  clearInterval(cdTimer);

  showLoading('APPLYING CUSTOM RANGE', 'Writing dates to Google Sheets…', 10);
  await writeSheetDates(from, to);

  setLoadingProgress(35, 'Waiting for formulas to recalculate…');
  await sleep(1500);
  setLoadingProgress(65, 'Recalculating…');
  await sleep(1500);
  setLoadingProgress(85, 'Fetching updated data…');

  await load(false);
  setLoadingProgress(100, 'Done!');
  await sleep(300);
  hideLoading();

  showActiveLabel(from, to);
  showToast(`✓ Custom range: ${displayDate(from)} → ${displayDate(to)}`, 'toast-success');
  startCountdown();
}

function parseCSV(text) {
  const rows  = [];
  const lines = text.trim().split('\n');
  for (const line of lines) {
    const cols = [];
    let current      = '';
    let insideQuotes = false;
    for (let i = 0; i < line.length; i++) {
      const char = line[i];
      if (char === '"') {
        insideQuotes = !insideQuotes;
      } else if (char === ',' && !insideQuotes) {
        cols.push(current.trim());
        current = '';
      } else {
        current += char;
      }
    }
    cols.push(current.trim());
    rows.push(cols);
  }
  return rows;
}

function pct(a, t) {
  return t ? Math.min((a / t) * 100, 100) : 0;
}

function cls(a, t) {
  if (a === 0) return 'zero';
  const p = (a / t) * 100;
  if (p >= 100) return 'good';
  if (p >= 60)  return 'ok';
  return 'bad';
}

function metricHTML(act, tgt) {
  const c = cls(act, tgt);
  const p = pct(act, tgt);
  return `
    <div class="metric">
      <div class="metric-top">
        <span class="m-act ${c}">${act}</span>
        <span class="m-tgt">/ ${tgt}</span>
      </div>
      <div class="bar-track">
        <div class="bar-fill ${c}" style="width:${p}%"></div>
      </div>
    </div>`;
}

function rankCircle(i) {
  const c = i===0?'r1': i===1?'r2': i===2?'r3':'rn';
  return `<div class="rank-circle ${c}">${i + 1}</div>`;
}

function ptsClass(p, max) {
  if (p >= max * 0.75) return 'pts-top';
  if (p >= max * 0.4)  return 'pts-mid';
  return 'pts-low';
}

function extractData(rows) {
  const members = rows
    .slice(4)
    .filter(r =>
      r[5] &&
      r[5].trim() !== '' &&
      !r[5].toLowerCase().includes('week total')
    )
    .map(r => ({
      yIM:     Number(r[1])  || 0,
      yClient: Number(r[2])  || 0,
      tIM:     Number(r[3])  || 0,
      tClient: Number(r[4])  || 0,
      name:    r[5],
      lTgt:    Number(r[6])  || 0,
      lAct:    Number(r[7])  || 0,
      imTgt:   Number(r[8])  || 0,
      imAct:   Number(r[9])  || 0,
      mtTgt:   Number(r[10]) || 0,
      mtAct:   Number(r[11]) || 0,
      ccTgt:   Number(r[12]) || 0,
      ccRpt:   Number(r[13]) || 0,
      ccDoc:   Number(r[14]) || 0,
      pts:     Number(r[15]) || 0
    }));

  const totalRow = rows.find(r =>
    r[5] && r[5].toLowerCase().includes('week total')
  );

  return { members, totalRow };
}

function groupByTeam(members) {
  /* Build a lookup: normalised name → team index */
  const lookup = new Map();
  TEAMS.forEach((team, ti) => {
    team.members.forEach(name => {
      lookup.set(name.trim().toLowerCase(), ti);
    });
  });

  /* Buckets: one array per team + overflow */
  const buckets = TEAMS.map(() => []);
  const others  = [];

  members.forEach(m => {
    const key = m.name.trim().toLowerCase();
    const ti  = lookup.get(key);
    if (ti !== undefined) {
      buckets[ti].push(m);
    } else {
      others.push(m);
    }
  });

  /* Sort each bucket by pts descending */
  buckets.forEach(b => b.sort((a, b_) => b_.pts - a.pts));
  others.sort((a, b_) => b_.pts - a.pts);

  return { buckets, others };
}
function render(rows) {
  const { members, totalRow } = extractData(rows);
  const { buckets, others }   = groupByTeam(members);

  let bodyHTML = '';

  /* ── Team rows ─────────────────────────────────────── */
  TEAMS.forEach((team, ti) => {
    const group  = buckets[ti];
    if (!group.length) return;
    const maxPts = group[0].pts || 1;

    group.forEach((m, i) => {
      bodyHTML += `
        <tr class="${team.rowClass}">
          <td class="center">${rankCircle(i)}</td>
          <td><div class="member-name">${m.name}</div></td>
          <td class="center big">${m.yIM}</td>
          <td class="center big">${m.yClient}</td>
          <td class="center big">${m.tIM}</td>
          <td class="center big">${m.tClient}</td>
          <td>${metricHTML(m.lAct, m.lTgt)}</td>
          <td>${metricHTML(m.imAct, m.imTgt)}</td>
          <td>${metricHTML(m.mtAct, m.mtTgt)}</td>
          <td class="center big">${m.ccTgt} - ${m.ccRpt} / ${m.ccDoc}</td>
          <td class="center"><div class="pts-badge ${ptsClass(m.pts, maxPts)}">${m.pts}</div></td>
        </tr>`;
    });
  });

  /* ── Unassigned overflow ───────────────────────────── */
  if (others.length) {
    const maxPts = others[0].pts || 1;
    others.forEach((m, i) => {
      bodyHTML += `
        <tr>
          <td class="center">${rankCircle(i)}</td>
          <td><div class="member-name">${m.name}</div></td>
          <td class="center big">${m.yIM}</td>
          <td class="center big">${m.yClient}</td>
          <td class="center big">${m.tIM}</td>
          <td class="center big">${m.tClient}</td>
          <td>${metricHTML(m.lAct, m.lTgt)}</td>
          <td>${metricHTML(m.imAct, m.imTgt)}</td>
          <td>${metricHTML(m.mtAct, m.mtTgt)}</td>
          <td class="center big">${m.ccTgt} - ${m.ccRpt} / ${m.ccDoc}</td>
          <td class="center"><div class="pts-badge ${ptsClass(m.pts, maxPts)}">${m.pts}</div></td>
        </tr>`;
    });
  }

  /* ── Week Total ────────────────────────────────────── */
  if (totalRow) {
    bodyHTML += `
      <tr class="total-row">
        <td></td>
        <td class="total-label">WEEK TOTAL</td>
        <td class="center big">${totalRow[1]}</td>
        <td class="center big">${totalRow[2]}</td>
        <td class="center big">${totalRow[3]}</td>
        <td class="center big">${totalRow[4]}</td>
        <td>${metricHTML(Number(totalRow[7]), Number(totalRow[6]))}</td>
        <td>${metricHTML(Number(totalRow[9]), Number(totalRow[8]))}</td>
        <td>${metricHTML(Number(totalRow[11]), Number(totalRow[10]))}</td>
        <td class="center big">${totalRow[12]} - ${totalRow[13]} / ${totalRow[14]}</td>
        <td class="center big" style="color:var(--gold);">${totalRow[15]}</td>
      </tr>`;
  }

  document.getElementById('tableBody').innerHTML = bodyHTML;
}
async function load(restartCountdown = true) {
  try {
    const res  = await fetch(CSV_URL + '&t=' + Date.now());
    const text = await res.text();
    const rows = parseCSV(text);
    render(rows);
    document.getElementById('lastUpdated').textContent =
      'Last updated ' + new Date().toLocaleTimeString();
    if (restartCountdown) startCountdown();
  } catch (err) {
    console.error('Load error:', err);
    if (restartCountdown) startCountdown();
  }
}
function startCountdown() {
  clearInterval(cdTimer);
  cdVal = REFRESH;
  document.getElementById('cdNum').textContent = cdVal;
  cdTimer = setInterval(() => {
    cdVal--;
    document.getElementById('cdNum').textContent = cdVal;
    if (cdVal <= 0) {
      clearInterval(cdTimer);
      load();
    }
  }, 1000);
}
load();
</script>
</body>
</html>
